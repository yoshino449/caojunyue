<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教务器材预约</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    color: #1f2329;
    line-height: 1.6;
  }

  header {
    padding: 32px 24px 8px;
    text-align: center;
  }
  header h1 { font-size: 24px; font-weight: 600; }
  header p { font-size: 14px; color: #8a9099; margin-top: 4px; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    max-width: 960px;
    margin: 24px auto;
    padding: 0 24px 40px;
  }

  .card {
    background: #fff;
    border: 1px solid #e8eaed;
    border-radius: 10px;
    padding: 20px;
    display: flex;
    flex-direction: column;
  }
  .card .icon { font-size: 34px; }
  .card h2 { font-size: 17px; font-weight: 600; margin: 10px 0 2px; }
  .card .model { font-size: 13px; color: #8a9099; }

  .bookings {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed #e8eaed;
    min-height: 44px;
  }
  .bookings .label { font-size: 12px; color: #8a9099; }
  .bookings ul { list-style: none; margin-top: 6px; }
  .bookings li {
    font-size: 13px;
    color: #41464d;
    padding: 3px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .bookings li .info { flex: 1; min-width: 0; }
  .bookings li .who { color: #8a9099; flex-shrink: 0; }
  .cancel-btn {
    border: none;
    background: none;
    color: #8a9099;
    font-size: 12px;
    cursor: pointer;
    padding: 2px 5px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .cancel-btn:hover { color: #d9302e; background: #fdecea; }
  .bookings .empty { font-size: 13px; color: #b6bac0; }

  .btn {
    margin-top: 16px;
    border: none;
    border-radius: 6px;
    padding: 9px 0;
    font-size: 14px;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-primary { background: #3370ff; color: #fff; }
  .btn-primary:hover { background: #2860e1; }
  .btn-ghost { background: #f2f3f5; color: #41464d; }
  .btn-ghost:hover { background: #e8eaed; }

  /* 弹窗 */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .overlay.show { display: flex; }

  .modal {
    background: #fff;
    border-radius: 10px;
    width: 100%;
    max-width: 360px;
    padding: 22px;
  }
  .modal h3 { font-size: 17px; font-weight: 600; }

  .field { margin-top: 14px; }
  .field label { display: block; font-size: 13px; color: #646a73; margin-bottom: 5px; }
  .field input, .field select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #d8dade;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    background: #fff;
  }
  .field input:focus, .field select:focus { border-color: #3370ff; }

  .error {
    display: none;
    margin-top: 12px;
    font-size: 13px;
    color: #d9302e;
    background: #fdecea;
    border-radius: 6px;
    padding: 7px 10px;
  }
  .error.show { display: block; }

  .actions { display: flex; gap: 10px; margin-top: 20px; }
  .actions .btn { margin-top: 0; flex: 1; }

  /* toast */
  .toast {
    position: fixed;
    top: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(-12px);
    background: #1f2329;
    color: #fff;
    font-size: 14px;
    padding: 9px 18px;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: all .25s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 统计入口与弹窗（T1：Chart.js 接入） */
  header { position: relative; }
  .stats-btn {
    position: absolute;
    top: 30px;
    right: 24px;
    padding: 6px 14px;
    font-size: 13px;
    border: 1px solid #d8dade;
    background: #fff;
    color: #41464d;
    border-radius: 6px;
    cursor: pointer;
  }
  .stats-btn:hover { background: #f2f3f5; }

  .modal-stats { max-width: 420px; }
  .chart-block { margin-top: 18px; }
  .chart-title { font-size: 13px; color: #646a73; margin-bottom: 6px; }
  .chart-wrap { position: relative; height: 220px; }   /* 固定高度配 maintainAspectRatio:false，防拉伸 */
  .stats-empty { font-size: 13px; color: #b6bac0; text-align: center; padding: 20px 0; }

  footer {
    text-align: center;
    font-size: 12px;
    color: #b6bac0;
    padding: 0 24px 28px;
  }
</style>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>

<header>
  <h1>教务器材预约</h1>
  <p>选择器材、日期与时段，同一器材同一时段不可重复预约</p>
  <button type="button" class="stats-btn" id="btnStats">📊 统计</button>
</header>

<main class="cards" id="cards"></main>

<footer id="visitsFooter">本页已被访问 — 次</footer>

<!-- 预约弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">预约器材</h3>
    <div class="field">
      <label for="inputUser">预约人</label>
      <input id="inputUser" type="text" placeholder="请输入姓名" maxlength="20">
    </div>
    <div class="field">
      <label for="inputDate">日期</label>
      <input id="inputDate" type="date">
    </div>
    <div class="field">
      <label for="inputSlot">时段</label>
      <select id="inputSlot">
        <option value="">请选择时段</option>
        <option value="第1-2节 08:00-09:35">第1-2节　08:00-09:35</option>
        <option value="第3-4节 10:00-11:35">第3-4节　10:00-11:35</option>
        <option value="第5-6节 14:00-15:35">第5-6节　14:00-15:35</option>
        <option value="第7-8节 16:00-17:35">第7-8节　16:00-17:35</option>
        <option value="晚间 19:00-21:00">晚间　　　19:00-21:00</option>
      </select>
    </div>
    <div class="error" id="formError"></div>
    <div class="actions">
      <button class="btn btn-ghost" id="btnCancel">取消</button>
      <button class="btn btn-primary" id="btnSubmit">提交预约</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 统计弹窗（T1：Chart.js） -->
<div class="overlay" id="statsOverlay">
  <div class="modal modal-stats">
    <h3>预约统计</h3>
    <div class="chart-block">
      <div class="chart-title">各器材预约量</div>
      <div class="chart-wrap"><canvas id="chartEquip"></canvas></div>
    </div>
    <div class="chart-block">
      <div class="chart-title">各时段热度</div>
      <div class="chart-wrap"><canvas id="chartSlot"></canvas></div>
    </div>
    <div class="actions">
      <button type="button" class="btn btn-primary" id="btnStatsClose">关闭</button>
    </div>
  </div>
</div>

<script>
  const EQUIPMENTS = [
    { id: 'projector', icon: '📽️', name: '投影仪', model: 'Epson CB-FH06' },
    { id: 'camera',    icon: '📷', name: '单反相机', model: 'Canon EOS 850D' },
    { id: 'speaker',   icon: '🔊', name: '便携音响', model: 'JBL EON ONE COMPACT' }
  ];

  let currentEquipId = null;
  let allBookings = [];   // 服务端数据缓存（含 id），每次操作后重新拉取
  let loaded = false;

  /* ---------- API ---------- */
  async function fetchBookings() {
    const res = await fetch('/api/bookings');
    if (!res.ok) throw new Error('加载失败');
    allBookings = await res.json();
    loaded = true;
    renderCards();
  }

  // 新建预约：冲突/校验失败时抛出服务端返回的错误信息
  async function createBooking(payload) {
    const res = await fetch('/api/bookings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || '预约失败，请稍后再试');
    return data;
  }

  async function removeBooking(id) {
    const res = await fetch(`/api/bookings/${encodeURIComponent(id)}`, { method: 'DELETE' });
    if (res.status !== 204 && res.status !== 404) throw new Error('取消失败，请稍后再试');
  }

  function todayStr() {
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${d.getFullYear()}-${m}-${day}`;
  }

  /* ---------- 渲染卡片 ---------- */
  function renderCards() {
    const wrap = document.getElementById('cards');
    wrap.innerHTML = '';

    EQUIPMENTS.forEach(eq => {
      const mine = allBookings
        .filter(b => b.equipId === eq.id && b.date >= todayStr())
        .sort((a, b) => a.date.localeCompare(b.date));

      const card = document.createElement('section');
      card.className = 'card';

      const listHtml = mine.length
        ? `<ul>${mine.map(b =>
            `<li><span class="info">${b.date}　${b.slot}</span><span class="who">${escapeHtml(b.user)}</span><button type="button" class="cancel-btn" data-id="${b.id}">取消</button></li>`
          ).join('')}</ul>`
        : `<div class="empty">${loaded ? '近期暂无预约' : '加载中…'}</div>`;

      card.innerHTML = `
        <div class="icon">${eq.icon}</div>
        <h2>${eq.name}</h2>
        <div class="model">${eq.model}</div>
        <div class="bookings">
          <div class="label">近期预约（${mine.length}）</div>
          ${listHtml}
        </div>
        <button class="btn btn-primary" data-id="${eq.id}">预约</button>
      `;
      card.querySelector('.btn-primary').addEventListener('click', () => openModal(eq.id));
      card.querySelectorAll('.cancel-btn').forEach((btn, i) => {
        btn.addEventListener('click', () => cancelBooking(mine[i]));
      });
      wrap.appendChild(card);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  /* ---------- 弹窗 ---------- */
  function openModal(equipId) {
    currentEquipId = equipId;
    const eq = EQUIPMENTS.find(e => e.id === equipId);
    document.getElementById('modalTitle').textContent = `预约「${eq.name}」`;
    document.getElementById('inputUser').value = '';
    document.getElementById('inputDate').value = '';
    document.getElementById('inputDate').min = todayStr();
    document.getElementById('inputSlot').value = '';
    showError('');
    document.getElementById('overlay').classList.add('show');
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('show');
    currentEquipId = null;
  }

  function showError(msg) {
    const el = document.getElementById('formError');
    el.textContent = msg;
    el.classList.toggle('show', !!msg);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  /* ---------- 提交（判重以服务端 409 为准） ---------- */
  async function submitBooking() {
    const user = document.getElementById('inputUser').value.trim();
    const date = document.getElementById('inputDate').value;
    const slot = document.getElementById('inputSlot').value;

    if (!user) return showError('请填写预约人姓名');
    if (!date) return showError('请选择预约日期');
    if (date < todayStr()) return showError('不能预约过去的日期');
    if (!slot) return showError('请选择预约时段');

    const btn = document.getElementById('btnSubmit');
    btn.disabled = true; // 防重复点击
    try {
      await createBooking({ equipId: currentEquipId, user, date, slot });
      closeModal();
      await fetchBookings();
      showToast('预约成功');
    } catch (e) {
      // 409 冲突 / 400 校验失败：留在弹窗，展示服务端返回的原因
      showError(e.message);
    } finally {
      btn.disabled = false;
    }
  }

  /* ---------- 取消预约：服务端删除后刷新，时段即可重新预约 ---------- */
  async function cancelBooking(b) {
    if (!confirm(`确定取消 ${b.date} ${b.slot} 的预约吗？`)) return;
    try {
      await removeBooking(b.id);
      await fetchBookings();
      showToast('已取消预约');
    } catch (e) {
      showToast(e.message);
    }
  }

  /* ---------- 预约统计（T1：Chart.js） ---------- */
  let chartEquip = null, chartSlot = null;

  function openStats() {
    if (typeof Chart === 'undefined') {
      showToast('统计组件加载失败，请检查网络');
      return;
    }
    document.getElementById('statsOverlay').classList.add('show');
    loadStats();
  }

  function closeStats() {
    document.getElementById('statsOverlay').classList.remove('show');
    if (chartEquip) { chartEquip.destroy(); chartEquip = null; }   // 关闭即销毁，防 canvas 复用报错
    if (chartSlot) { chartSlot.destroy(); chartSlot = null; }
  }

  async function loadStats() {
    try {
      const res = await fetch('/api/stats');
      if (!res.ok) throw new Error('统计加载失败');
      const data = await res.json();

      // 柱状图：各器材预约量（按固定器材顺序补 0，保证三台都出现）
      const equipLabels = EQUIPMENTS.map(e => e.name);
      const equipData = EQUIPMENTS.map(e => {
        const row = data.perEquip.find(r => r.equipId === e.id);
        return row ? row.count : 0;
      });
      if (chartEquip) chartEquip.destroy();
      chartEquip = new Chart(document.getElementById('chartEquip'), {
        type: 'bar',
        data: { labels: equipLabels, datasets: [{ label: '预约量', data: equipData, backgroundColor: '#3370ff' }] },
        options: { maintainAspectRatio: false, responsive: true,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
      });

      // 饼图：各时段热度
      if (chartSlot) chartSlot.destroy();
      chartSlot = new Chart(document.getElementById('chartSlot'), {
        type: 'doughnut',
        data: { labels: data.perSlot.map(r => r.slot), datasets: [{ data: data.perSlot.map(r => r.count), backgroundColor: ['#3370ff', '#4ca6ff', '#ffce5c', '#ff9f5c', '#a877ff'] }] },
        options: { maintainAspectRatio: false, responsive: true, plugins: { legend: { position: 'right' } } }
      });
    } catch (e) {
      showToast(e.message);
    }
  }

  /* ---------- 事件绑定 ---------- */
  document.getElementById('btnSubmit').addEventListener('click', submitBooking);
  document.getElementById('btnCancel').addEventListener('click', closeModal);
  document.getElementById('overlay').addEventListener('click', e => {
    if (e.target.id === 'overlay') closeModal();
  });
  document.getElementById('btnStats').addEventListener('click', openStats);
  document.getElementById('btnStatsClose').addEventListener('click', closeStats);
  document.getElementById('statsOverlay').addEventListener('click', e => {
    if (e.target.id === 'statsOverlay') closeStats();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); closeStats(); }
  });

  renderCards(); // 先画骨架（加载中…），数据到了再刷新
  fetchBookings().catch(() => showToast('预约数据加载失败，请刷新重试'));
  fetchVisits().catch(() => {});   // 访问计数加载失败不阻塞主流程

  async function fetchVisits() {
    const res = await fetch('/api/visits');
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById('visitsFooter').textContent = `本页已被访问 ${data.count} 次`;
  }
</script>
</body>
</html>
